<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cap Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0f1218;--card:#171b24;--line:#232a38;--ink:#e9ecf2;--mute:#8e96a6;--co:#ff5a4e;--te:#2fc6b0;--go:#f2c14e}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Archivo,system-ui,sans-serif;overflow-x:clip}
#app{max-width:560px;margin:0 auto;padding:0 0 84px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,g:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 8px}
h1{font-size:22px;margin:0;line-height:1.1}
.k{color:var(--mute);font-size:13px;margin:2px 0 0}
.mode{display:flex;background:var(--card);border-radius:22px;padding:3px}
.mode button{border:0;background:none;padding:8px 12px;border-radius:18px;min-height:36px;color:var(--mute);font-weight:600}
.mode .on{background:var(--line);color:var(--ink)}
.ff{display:flex;justify-content:space-between;align-items:center;margin:0 16px 8px;padding:8px 12px;border:1px dashed var(--line);border-radius:12px;color:var(--mute);font-size:13px}
.ff button{background:var(--go);color:#14161c;border:0;border-radius:10px;padding:8px 12px;font-weight:800;min-height:40px}
.toast{margin:0 16px 8px;padding:10px 12px;border-radius:10px;background:rgba(255,90,78,.15);color:#ff9d94}
main{padding:0 16px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 12px}
.stats div{background:var(--card);border-radius:12px;padding:10px}
.stats b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.city{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px 4px}
.district{flex:none;scroll-snap-align:end;border-radius:14px;overflow:hidden;background:#151a24;opacity:.82}
.district.now{opacity:1;box-shadow:0 0 0 2px rgba(242,193,78,.5)}
.district svg{display:block}
.dlabel{padding:8px 12px;font-size:12px;font-weight:800;color:var(--mute)}
.now .dlabel{color:var(--go)}
.bld,.lot{cursor:pointer}
.hint{color:var(--mute);font-size:13px;margin:8px 0}
h2{font-size:15px;margin:14px 0 6px}.h{font-size:18px}
.today{display:flex;flex-direction:column;gap:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:0;border-radius:12px;padding:12px;min-height:48px;text-align:left;width:100%}
.row.alert{box-shadow:inset 0 0 0 1px rgba(255,90,78,.5)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--co);margin-right:8px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--line);white-space:nowrap}
.pill.co{background:rgba(255,90,78,.18);color:#ff9d94}.pill.go{background:rgba(242,193,78,.16);color:var(--go)}
.n{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.deal{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
.deal.backed{box-shadow:inset 0 0 0 1px rgba(47,198,176,.5)}
.deal header{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}
.deal h3{margin:0;font-size:18px}.deal header p{margin:2px 0 0;color:var(--mute);font-size:13px}
.heat{text-align:right;white-space:nowrap}.heat i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--co);margin-left:3px}.heat small{display:block;color:var(--mute);font-size:11px}
.trait{display:grid;grid-template-columns:96px minmax(0,1fr) 40px 56px;align-items:center;gap:8px;margin:7px 0}
.tl{font-size:13px;font-weight:600}.tl small{display:block;color:var(--mute);font-weight:400;font-size:11px}
.range{position:relative;height:10px;border-radius:5px;background:#232a38}
.range i{position:absolute;top:0;bottom:0;border-radius:5px;background:rgba(242,193,78,.55)}
.range i.sharp{background:var(--go)}
.grade{font-weight:800;font-size:13px;text-align:center}
.peek{border:1px dashed var(--go);background:none;color:var(--go);border-radius:10px;font-size:12px;font-weight:700;min-height:32px}
.meta{color:var(--mute);font-size:13px;margin:8px 0}
.buy{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.buy button{border:0;border-radius:12px;background:#232a38;padding:8px 2px;min-height:48px}
.buy button b{display:block}.buy button small{color:var(--mute);font-size:11px}
.buy button:disabled{opacity:.35;cursor:not-allowed}
.buy .ghost{background:none;border:1px solid var(--line);color:var(--mute)}
.held{font-weight:700;color:var(--te)}.held.muted{color:var(--mute)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{color:var(--mute);font-size:12px;font-weight:600}.tbl .r{text-align:right}
.tbl tr.you td{color:var(--go);font-weight:800}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#121620;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;max-width:180px;border:0;background:none;color:var(--mute);font-weight:700;min-height:48px;border-radius:12px}
.tabs .on{color:var(--ink);background:var(--card)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.sheet h2{font-size:22px;margin:0}
.x{position:absolute;right:12px;top:10px;border:0;background:var(--line);border-radius:50%;width:40px;height:40px;font-size:20px}
.spark{display:block;margin:12px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:6px 0 12px}.kv span{color:var(--mute)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.offer{background:rgba(255,90,78,.1);border:1px solid rgba(255,90,78,.4);border-radius:12px;padding:12px;margin-bottom:10px}
.offer button,.sell{display:block;width:100%;margin-top:10px;border:0;border-radius:12px;min-height:48px;font-weight:800}
.offer button{background:var(--co);color:#fff}.sell{background:#232a38}.sell small{color:var(--mute);font-weight:400}
@media(max-width:380px){.trait{grid-template-columns:82px minmax(0,1fr) 34px 50px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/*APP*/
</script>
</body>
</html>
